name = "hex-perm-group-mathlib"
defaultTargets = ["HexPermGroupMathlib"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexPermGroup"
git = "https://github.com/leanprover/hex-perm-group.git"
rev = "v0.6.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "HexPermGroupMathlib"

[[lean_lib]]
name = "HexPermGroupMathlibTests"
globs = ["HexPermGroupMathlib.Tests"]
